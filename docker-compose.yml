version: '3.8'

services:
  app:
    build: .
    container_name: taty-touch-fashion-docker-app
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taty-touch-fashion-docker-db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_HOST: maildev
      SPRING_MAIL_PORT: 1025
    depends_on:
      mysql:
        condition: service_healthy
      maildev:
        condition: service_started
    networks:
      - taty-touch-fashion-docker-network

  mysql:
    image: mysql:8.0
    container_name: taty-touch-fashion-docker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cameroon26}
      MYSQL_DATABASE: taty-touch-fashion-docker-db
      MYSQL_USER: ${DB_USERNAME:-root}
      # Ne pas définir MYSQL_USER/MYSQL_PASSWORD si tu utilises déjà root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - taty-touch-fashion-docker-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-cameroon26}"]
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    container_name: taty-touch-fashion-docker-maildev
    restart: unless-stopped
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - taty-touch-fashion-docker-network

volumes:
  mysql-data:

networks:
  taty-touch-fashion-docker-network:
    driver: bridge